[package]
name = "kubeclean-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_Security", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"
